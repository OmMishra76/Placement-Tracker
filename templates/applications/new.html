{% extends "base.html" %}

{% block title %}Add Application - Placement Tracker{% endblock %}

{% block content %}
<h2>Add New Application</h2>

<form method="POST" action="{{ url_for('applications.new_application') }}">
    <div class="mb-3">
        <label for="company" class="form-label">Company</label>
        <input type="text" class="form-control" id="company" name="company" required>
    </div>

    <div class="mb-3">
        <label for="role" class="form-label">Role</label>
        <input type="text" class="form-control" id="role" name="role" required>
    </div>

    <div class="mb-3">
        <label for="job_link" class="form-label">Job Link</label>
        <input type="url" class="form-control" id="job_link" name="job_link">
    </div>

    <div class="mb-3">
        <label for="apply_date" class="form-label">Apply Date</label>
        <input type="date" class="form-control" id="apply_date" name="apply_date">
    </div>

    <div class="mb-3">
        <label for="deadline" class="form-label">Deadline</label>
        <input type="date" class="form-control" id="deadline" name="deadline">
    </div>

    <div class="mb-3">
        <label for="status" class="form-label">Status</label>
        <select class="form-select" id="status" name="status">
            <option value="Applied">Applied</option>
            <option value="OA">OA</option>
            <option value="Interview">Interview</option>
            <option value="Offer">Offer</option>
            <option value="Rejected">Rejected</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="resume_version" class="form-label">Resume Version</label>
        <input type="text" class="form-control" id="resume_version" name="resume_version" placeholder="e.g. Backend_Resume">
    </div>

    <div class="mb-3">
        <label for="notes" class="form-label">Notes</label>
        <textarea class="form-control" id="notes" name="notes" rows="3"></textarea>
    </div>

    <button type="submit" class="btn btn-primary">Add Application</button>
</form>
{% endblock %}
